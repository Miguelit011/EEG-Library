[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-library"
version = "0.13.0"
description = "Librería para el procesamiento de señales EEG del casco Emotiv Epoc X"
requires-python = ">=3.10"
dependencies = [
    # reader.py elige el montaje según la versión: "colin27_1020" desde la
    # 1.13, "standard_1020" hasta la 1.12 (ver MONTAJE_1020).
    "mne>=1.12",
    "numpy",
    "scipy",
    "pandas",
    "mne-icalabel",
    "onnxruntime",
    # Motor de parquet para las salidas del procesamiento por lotes (Fase 11).
    "pyarrow",
    # Modelos y validación cruzada del subpaquete modelado (Fase 14 en adelante).
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Escritura de EDF, que usa test_batch.py para generar archivos reales en
    # vez de mockear la lectura (los workers del lote corren en otros procesos,
    # donde un monkeypatch del proceso padre no existiría).
    "edfio",
]

[tool.setuptools.packages.find]
where = ["src"]