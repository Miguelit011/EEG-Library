[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-library"
version = "0.17.0"
description = "Librería para el procesamiento de señales EEG del casco Emotiv Epoc X"
# Los modelos empaquetados (src/eeg_library/modelos) se guardaron con
# Python 3.10 y scikit-learn 1.7.2; con otras versiones joblib no garantiza
# poder cargarlos ni que predigan igual.
requires-python = ">=3.10,<3.11"
dependencies = [
    # reader.py elige el montaje según la versión: "colin27_1020" desde la
    # 1.13, "standard_1020" hasta la 1.12 (ver MONTAJE_1020).
    "mne>=1.12",
    "numpy",
    "scipy",
    "pandas",
    "mne-icalabel",
    "onnxruntime",
    # Motor de parquet para las salidas del procesamiento por lotes (Fase 11).
    "pyarrow",
    # Modelos y validación cruzada del subpaquete modelado (Fase 14 en adelante).
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Escritura de EDF, que usa test_batch.py para generar archivos reales en
    # vez de mockear la lectura (los workers del lote corren en otros procesos,
    # donde un monkeypatch del proceso padre no existiría).
    "edfio",
]
# Guiones de analisis/ (no los necesita la librería ni sus tests). Las versiones
# exactas con que se generaron los resultados están en requirements-validacion.txt.
analisis = [
    # Figuras de todas las líneas de análisis.
    "matplotlib",
    # Lectura de la base de cuestionarios (.xlsx) en analisis/fatiga_fg_fc.
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Modelos c1, c2 y c3 con sus fichas (ver analisis/empaquetar_modelos.py) y los de
# tiempo en tarea (analisis/empaquetar_modelos_tiempo_en_tarea.py).
eeg_library = ["modelos/*.joblib", "modelos/*.json",
               "modelos/tiempo_en_tarea/*.joblib", "modelos/tiempo_en_tarea/*.json",
               "modelos/tiempo_en_tarea/*.onnx"]

[tool.pytest.ini_options]
markers = [
    "datos: necesita el dataset real en EEG_DATA (lento; se lanza con -m datos)",
]
addopts = "-m 'not datos'"